<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Snare drum, side view, meadow palette -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3c969"/>
      <stop offset="100%" stop-color="#c9a24a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#ece6d8"/>
    </linearGradient>
  </defs>

  <!-- crossed drumsticks behind -->
  <g stroke="#5a574f" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="6"  y1="56" x2="32" y2="22"/>
    <line x1="58" y1="56" x2="32" y2="22"/>
  </g>
  <circle cx="6"  cy="56" r="2.2" fill="#5a574f"/>
  <circle cx="58" cy="56" r="2.2" fill="#5a574f"/>

  <!-- shell body -->
  <rect x="10" y="22" width="44" height="26" rx="2" fill="url(#shell)"/>

  <!-- top rim -->
  <ellipse cx="32" cy="22" rx="22" ry="6" fill="url(#head)" stroke="#28261f" stroke-width="1.4"/>

  <!-- bottom rim -->
  <path d="M 10 48 Q 32 56 54 48" fill="none" stroke="#28261f" stroke-width="1.4"/>

  <!-- diagonal tension stripes -->
  <g stroke="#28261f" stroke-width="1.2" opacity="0.55">
    <line x1="16" y1="22" x2="12" y2="48"/>
    <line x1="24" y1="22" x2="22" y2="49"/>
    <line x1="32" y1="22" x2="32" y2="50"/>
    <line x1="40" y1="22" x2="42" y2="49"/>
    <line x1="48" y1="22" x2="52" y2="48"/>
  </g>

  <!-- meadow green accent dot on the drum -->
  <circle cx="32" cy="35" r="3.2" fill="#5ac47a"/>
</svg>
